<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>boji</h1>
    <h2>music</h2>
  </header>

  <main style="padding: 2rem 3rem; flex-direction: column; gap: 1.2rem; max-width: 400px;">
    <section style="padding: 1.5rem 2rem; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 18px; box-shadow: 0 3px 12px var(--shadow-sm); display: flex; flex-direction: column; gap: 1rem;">
      <button id="pink-noise">▶ pink noise</button>
      <button id="white-noise">▶ white noise</button>
      <p id="noise-status" style="margin: 0; font-style: italic; color: var(--text-light); font-size: 0.9rem;"></p>
    </section>

    <button id="mute-btn" style="align-self: flex-start; font-size: 1rem; padding: 0.6rem 1.6rem; border-radius: 22px; border: 2px solid var(--border); background: rgba(var(--btn-rgb),0.16); color: var(--text); transition: background 0.15s, transform 0.15s;">mute</button>
  </main>

  <footer>
    <a href="settings.html">← back</a>
  </footer>

  <script>
    var pinkBtn  = document.getElementById('pink-noise');
    var whiteBtn = document.getElementById('white-noise');
    var status   = document.getElementById('noise-status');

    function getPlaying() {
      return localStorage.getItem('boji-music') || '';
    }

    function setPlaying(val) {
      localStorage.setItem('boji-music', val);
      updateUI();
    }

    var muteBtn = document.getElementById('mute-btn');

    function getMuted() {
      return localStorage.getItem('boji-muted') === 'true';
    }

    function updateUI() {
      var p = getPlaying();
      var m = getMuted();
      pinkBtn.textContent  = (p === 'pink')  ? '⏹ pink noise'  : '▶ pink noise';
      whiteBtn.textContent = (p === 'white') ? '⏹ white noise' : '▶ white noise';
      status.textContent   = p ? (m ? 'muted — ' : 'now playing: ') + p + ' noise' : '';
      muteBtn.textContent  = m ? 'unmute' : 'mute';
      muteBtn.style.background = m ? 'rgba(var(--btn-rgb),0.38)' : 'rgba(var(--btn-rgb),0.16)';
      muteBtn.style.borderColor = m ? 'var(--accent)' : 'var(--border)';
    }

    pinkBtn.addEventListener('click', function() {
      setPlaying(getPlaying() === 'pink' ? '' : 'pink');
    });

    whiteBtn.addEventListener('click', function() {
      setPlaying(getPlaying() === 'white' ? '' : 'white');
    });

    muteBtn.addEventListener('click', function() {
      localStorage.setItem('boji-muted', getMuted() ? 'false' : 'true');
      updateUI();
    });

    updateUI();
  </script>
  <script src="pet-widget.js"></script>
  <script>
    (function() {
      var saved = localStorage.getItem('boji-theme');
      if (saved) document.body.classList.add('theme-' + saved);
    })();
  </script>

</body>
</html>
