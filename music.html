<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - Music</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>boji</h1>
    <h2>music</h2>
  </header>

  <main>
    <button id="pink-noise">▶ pink noise</button>
    <br><br>
    <button id="white-noise">▶ white noise</button>
    <p id="noise-status" style="margin-top:1rem; color:#888;"></p>
  </main>

  <footer>
    <a href="settings.html">⬅ back</a>
  </footer>

  <script>
    var audioCtx = null;
    var currentSource = null;
    var gainNode = null;

    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function stopNoise() {
      if (currentSource) {
        currentSource.stop();
        currentSource.disconnect();
        currentSource = null;
      }
      if (gainNode) {
        gainNode.disconnect();
        gainNode = null;
      }
    }

    function playWhiteNoise() {
      var ctx = getCtx();
      var bufferSize = ctx.sampleRate * 2;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.15;
      }
      var source = ctx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      gainNode = ctx.createGain();
      gainNode.gain.value = 0.6;
      source.connect(gainNode);
      gainNode.connect(ctx.destination);
      source.start();
      return source;
    }

    function playPinkNoise() {
      var ctx = getCtx();
      var bufferSize = ctx.sampleRate * 2;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (var i = 0; i < bufferSize; i++) {
        var white = Math.random() * 2 - 1;
        b0 = 0.99886*b0 + white*0.0555179;
        b1 = 0.99332*b1 + white*0.0750759;
        b2 = 0.96900*b2 + white*0.1538520;
        b3 = 0.86650*b3 + white*0.3104856;
        b4 = 0.55000*b4 + white*0.5329522;
        b5 = -0.7616*b5 - white*0.0168980;
        data[i] = (b0+b1+b2+b3+b4+b5+b6 + white*0.5362) * 0.05;
        b6 = white * 0.115926;
      }
      var source = ctx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      gainNode = ctx.createGain();
      gainNode.gain.value = 0.7;
      source.connect(gainNode);
      gainNode.connect(ctx.destination);
      source.start();
      return source;
    }

    var playing = null;

    document.getElementById('pink-noise').addEventListener('click', function() {
      if (playing === 'pink') {
        stopNoise();
        playing = null;
        this.textContent = '▶ pink noise';
        document.getElementById('noise-status').textContent = '';
      } else {
        stopNoise();
        currentSource = playPinkNoise();
        playing = 'pink';
        this.textContent = '⏹ pink noise';
        document.getElementById('white-noise').textContent = '▶ white noise';
        document.getElementById('noise-status').textContent = 'now playing: pink noise';
      }
    });

    document.getElementById('white-noise').addEventListener('click', function() {
      if (playing === 'white') {
        stopNoise();
        playing = null;
        this.textContent = '▶ white noise';
        document.getElementById('noise-status').textContent = '';
      } else {
        stopNoise();
        currentSource = playWhiteNoise();
        playing = 'white';
        this.textContent = '⏹ white noise';
        document.getElementById('pink-noise').textContent = '▶ pink noise';
        document.getElementById('noise-status').textContent = 'now playing: white noise';
      }
    });
  </script>
  <script src="pet-widget.js"></script>

</body>
</html>
