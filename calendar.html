<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>boji - Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>boji</h1>
    <h2>calendar</h2>
  </header>
  <main style="display: flex; flex-direction: row; gap: 3rem; padding: 2rem 3rem;">
    <section style="padding: 1.5rem 2rem; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 18px; box-shadow: 0 3px 12px var(--shadow-sm); min-width: 320px;">
      <div id="cal-nav" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;gap:0.5rem;">
        <button id="cal-prev" style="width:34px;height:34px;padding:0;border-radius:50%;font-size:1rem;">&#8592;</button>
        <div style="display:flex;align-items:center;gap:0.4rem;">
          <span id="cal-month-label" style="font-size:1rem;font-weight:bold;color:var(--accent-dark);letter-spacing:0.04em;"></span>
          <div style="display:flex;flex-direction:column;gap:1px;">
            <button id="cal-year-up" title="next year" style="width:24px;height:18px;padding:0;border-radius:6px;font-size:0.65rem;line-height:1;">&#9650;</button>
            <button id="cal-year-down" title="prev year" style="width:24px;height:18px;padding:0;border-radius:6px;font-size:0.65rem;line-height:1;">&#9660;</button>
          </div>
        </div>
        <button id="cal-next" style="width:34px;height:34px;padding:0;border-radius:50%;font-size:1rem;">&#8594;</button>
      </div>
      <div id="calendar-widget"></div>
      <div id="cal-legend" style="display:flex;gap:1rem;align-items:center;margin-top:0.6rem;font-size:0.78rem;color:var(--text-light);font-style:italic;">
        <span style="display:flex;align-items:center;gap:0.35rem;">
          <span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#fdf0c0,#fae880);border:1.5px solid #d4a96a;"></span> today
        </span>
        <span style="display:flex;align-items:center;gap:0.35rem;">
          <span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,rgba(var(--accent-rgb),0.35),rgba(var(--accent-rgb),0.18));border:1.5px solid var(--accent);"></span> selected
        </span>
        <span style="display:flex;align-items:center;gap:0.35rem;">
          <span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--bg-card);border:1.5px solid var(--border);position:relative;">
            <span style="position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--accent);line-height:1;">•</span>
          </span> has task
        </span>
      </div>
      <div id="add-event-container">
        <button id="new-event" disabled>+</button>
        <span id="pick-date-msg" style="color:#c00;display:none;margin-left:1em;">Pick a date first!</span>
      </div>
      <div id="task-list-section">
        <h3>Tasks for selected date</h3>
        <ul id="task-list"></ul>
      </div>
      <div style="margin-top:2rem;">
        <a href="index.html" class="nav-back">←</a>
      </div>
    </section>
  </main>
  <footer></footer>

  <!-- Modal for adding tasks -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close">&times;</span>
      <h3>Add Task</h3>
      <input type="text" id="task-input" placeholder="Task description">
      <button id="add-task-modal-btn">Add</button>
    </div>
  </div>

  <script>
    // Calendar logic
    const calendarWidget = document.getElementById('calendar-widget');
    const addEventBtn = document.getElementById('new-event');
    const pickDateMsg = document.getElementById('pick-date-msg');
    const taskList = document.getElementById('task-list');
    const modal = document.getElementById('task-modal');
    const closeModal = document.getElementById('close-modal');
    const taskInput = document.getElementById('task-input');
    const addTaskModalBtn = document.getElementById('add-task-modal-btn');

    let selectedDate = null;
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    const TODAY = new Date().toISOString().slice(0,10);

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const monthLabel = document.getElementById('cal-month-label');
    const calPrev = document.getElementById('cal-prev');
    const calNext = document.getElementById('cal-next');
    const calYearUp = document.getElementById('cal-year-up');
    const calYearDown = document.getElementById('cal-year-down');

    calPrev.addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      buildCalendar(currentYear, currentMonth);
    });
    calNext.addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      buildCalendar(currentYear, currentMonth);
    });
    calYearUp.addEventListener('click', () => { currentYear++; buildCalendar(currentYear, currentMonth); });
    calYearDown.addEventListener('click', () => { currentYear--; buildCalendar(currentYear, currentMonth); });

    // Click the year text to type a year directly
    monthLabel.addEventListener('click', (e) => {
      const yearStr = monthLabel.textContent.split(' ')[1];
      const input = document.createElement('input');
      input.type = 'number';
      input.value = yearStr;
      input.style.cssText = 'width:70px;font-size:1rem;font-family:inherit;border:1.5px solid var(--border);border-radius:8px;padding:0.1rem 0.3rem;color:var(--accent-dark);background:var(--bg-card);text-align:center;';
      monthLabel.replaceWith(input);
      input.focus();
      input.select();
      const commit = () => {
        const y = parseInt(input.value);
        if (!isNaN(y) && y > 0) { currentYear = y; }
        input.replaceWith(monthLabel);
        buildCalendar(currentYear, currentMonth);
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') input.blur(); });
    });

    function buildCalendar(year = currentYear, month = currentMonth) {
      monthLabel.textContent = MONTHS[month] + ' ' + year;
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const allTasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const taskDates = new Set(allTasks.map(t => t.date));
      let html = `<table><thead><tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
        <th>Thu</th><th>Fri</th><th>Sat</th>
        </tr></thead><tbody><tr>`;
      let dayCount = 0;
      for (let i = 0; i < firstDay; i++) {
        html += `<td></td>`;
        dayCount++;
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        const isoDate = cellDate.toISOString().slice(0,10);
        const classes = [];
        if (isoDate === TODAY) classes.push('today');
        if (taskDates.has(isoDate)) classes.push('has-task');
        const classAttr = classes.length ? ` class="${classes.join(' ')}"` : '';
        html += `<td data-date="${isoDate}"${classAttr}>${day}</td>`;
        dayCount++;
        if (dayCount % 7 === 0 && day !== daysInMonth) html += `</tr><tr>`;
      }
      html += `</tr></tbody></table>`;
      calendarWidget.innerHTML = html;

      // Re-apply selected class if a date is already selected
      if (selectedDate) {
        const sel = calendarWidget.querySelector(`td[data-date="${selectedDate}"]`);
        if (sel) sel.classList.add('selected');
      }

      // Add click listeners to each cell
      calendarWidget.querySelectorAll('td[data-date]').forEach(td => {
        td.addEventListener('click', () => {
          calendarWidget.querySelectorAll('td.selected').forEach(n => n.classList.remove('selected'));
          td.classList.add('selected');
          selectedDate = td.getAttribute('data-date');
          addEventBtn.disabled = false;
          pickDateMsg.style.display = 'none';
          renderTasksForDate();
        });
      });
    }

    // Show modal
    function showModal() {
      modal.classList.remove('hidden');
      taskInput.value = '';
      taskInput.focus();
    }

    // Hide modal
    function hideModal() {
      modal.classList.add('hidden');
    }

    // Add task
    function addTask(text, date) {
      if (!text) return;
      let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      tasks.push({ text, completed: false, date });
      localStorage.setItem('tasks', JSON.stringify(tasks));
      buildCalendar(currentYear, currentMonth);
      renderTasksForDate();
    }

    // Render tasks for selected date
    function renderTasksForDate() {
      let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      let date = selectedDate;
      let filtered = tasks.filter(t => t.date === date);
      taskList.innerHTML = '';
      filtered.forEach((task, idx) => {
        const li = document.createElement('li');
        li.textContent = task.text;
        li.style.textDecoration = task.completed ? 'line-through' : 'none';
        li.style.cursor = 'pointer';
        li.addEventListener('click', () => {
          // Toggle completed
          let allTasks = JSON.parse(localStorage.getItem('tasks') || '[]');
          let globalIdx = allTasks.findIndex(
            t => t.text === task.text && t.date === task.date
          );
          if (globalIdx !== -1) {
            allTasks[globalIdx].completed = !allTasks[globalIdx].completed;
            localStorage.setItem('tasks', JSON.stringify(allTasks));
            renderTasksForDate();
          }
        });
        taskList.appendChild(li);
      });
    }

    // Modal event listeners
    addEventBtn.addEventListener('click', () => {
      if (!selectedDate) {
        pickDateMsg.style.display = 'inline';
        return;
      }
      showModal();
    });
    closeModal.addEventListener('click', hideModal);
    addTaskModalBtn.addEventListener('click', () => {
      const text = taskInput.value.trim();
      const date = selectedDate;
      if (text && date) {
        addTask(text, date);
        hideModal();
      }
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) hideModal();
    });

    // Initial render
    buildCalendar();
    addEventBtn.disabled = true;
    pickDateMsg.style.display = 'inline';
    renderTasksForDate();
  </script>
  <script src="pet-widget.js"></script>
  <script>
    (function() {
      var saved = localStorage.getItem('boji-theme');
      if (saved) document.body.classList.add('theme-' + saved);
    })();
  </script>
</body>
</html>
