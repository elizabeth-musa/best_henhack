<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>boji audio</title></head>
<body>
<script>
  var audioCtx = null;
  var currentSource = null;
  var gainNode = null;
  var currentPlaying = '';

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function stopNoise() {
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource.disconnect();
      currentSource = null;
    }
    if (gainNode) {
      gainNode.disconnect();
      gainNode = null;
    }
  }

  function playWhiteNoise() {
    var ctx = getCtx();
    var bufferSize = ctx.sampleRate * 2;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.15;
    }
    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    gainNode = ctx.createGain();
    gainNode.gain.value = 0.6;
    source.connect(gainNode);
    gainNode.connect(ctx.destination);
    source.start();
    return source;
  }

  function playPinkNoise() {
    var ctx = getCtx();
    var bufferSize = ctx.sampleRate * 2;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (var i = 0; i < bufferSize; i++) {
      var white = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + white*0.0555179;
      b1 = 0.99332*b1 + white*0.0750759;
      b2 = 0.96900*b2 + white*0.1538520;
      b3 = 0.86650*b3 + white*0.3104856;
      b4 = 0.55000*b4 + white*0.5329522;
      b5 = -0.7616*b5 - white*0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6 + white*0.5362) * 0.05;
      b6 = white * 0.115926;
    }
    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    gainNode = ctx.createGain();
    gainNode.gain.value = 0.7;
    source.connect(gainNode);
    gainNode.connect(ctx.destination);
    source.start();
    return source;
  }

  function tick() {
    var desired = localStorage.getItem('boji-music') || '';
    var muted   = localStorage.getItem('boji-muted') === 'true';
    if (desired !== currentPlaying) {
      stopNoise();
      currentPlaying = desired;
      if (desired === 'pink') {
        currentSource = playPinkNoise();
      } else if (desired === 'white') {
        currentSource = playWhiteNoise();
      }
    }
    if (gainNode) {
      var targetVol = muted ? 0 : (currentPlaying === 'white' ? 0.6 : 0.7);
      gainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);
    }
  }

  setInterval(tick, 300);
</script>
</body>
</html>
