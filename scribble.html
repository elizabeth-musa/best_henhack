<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - Scribble Log</title>
</head>

<body>

  <header>
    <h1>boji</h1>
    <h2>scribble log</h2>
  </header>

  <main>
    <textarea id="scribble-input" placeholder="empty your mind"></textarea>
    <br>
    <button id="turn-into-task">turn into task</button>
    <button id="save-scribble">save</button>

    <aside id="scribble-list">
      <!-- scribble items will be added here -->
    </aside>
  </main>

  <footer>
     <a href="index.html" id="back-btn" style="display:inline-block;text-decoration:none;font-size:2rem;padding:0.5rem 1rem;border:1px solid #888;border-radius:8px;background:#f5f5f5;color:#333;">&#8592; Back</a>
  </footer>

  <script>
    // scribble log logic
    const input = document.getElementById('scribble-input');
    const saveBtn = document.getElementById('save-scribble');
    const turnBtn = document.getElementById('turn-into-task');
    const listElem = document.getElementById('scribble-list');

    let scribbles = [];

    function loadScribbles() {
      const stored = localStorage.getItem('scribbles');
      scribbles = stored ? JSON.parse(stored) : [];
    }

    function saveScribbles() {
      localStorage.setItem('scribbles', JSON.stringify(scribbles));
    }

    function renderScribbles() {
      listElem.innerHTML = '';
      scribbles.forEach((entry, idx) => {
        const btn = document.createElement('button');
        btn.className = 'scribble-item';
        btn.textContent = entry.text.length > 20 ? entry.text.slice(0,20)+'...' : entry.text;
        btn.addEventListener('click', () => {
          // navigate to view page
          location.href = `scribble_view.html?id=${entry.id}`;
        });
        listElem.appendChild(btn);
      });
    }

    function addScribble(text) {
      if (!text) return;
      const id = Date.now().toString();
      scribbles.push({ id, text });
      saveScribbles();
      renderScribbles();
    }

    function addTaskFromText(text) {
      if (!text) return;
      const tasksStored = localStorage.getItem('tasks');
      const tasksArray = tasksStored ? JSON.parse(tasksStored) : [];
      tasksArray.push({ text, completed: false, date: new Date().toISOString() });
      localStorage.setItem('tasks', JSON.stringify(tasksArray));
    }

    saveBtn.addEventListener('click', () => {
      addScribble(input.value.trim());
      input.value = '';
    });

    turnBtn.addEventListener('click', () => {
      const txt = input.value.trim();
      if (txt) {
        addTaskFromText(txt);
        input.value = '';
      }
    });

    // initialise
    loadScribbles();
    renderScribbles();
  </script>
  <script>
    (function() {
      var themes = { dreamscape: '#fadadd', comfort: '#cce5ff', original: '#ffffff' };
      var saved = localStorage.getItem('boji-theme');
      if (saved && themes[saved]) document.body.style.backgroundColor = themes[saved];
    })();
  </script>
</body>
</html>
