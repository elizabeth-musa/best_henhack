<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - Scribble Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>boji</h1>
    <h2>scribble log</h2>
  </header>

  <main style="padding: 2rem 3rem; flex-direction: column; max-width: 640px;">
    <section style="padding: 1.5rem 2rem; background: #fffaf4; border: 1.5px solid #edd9bb; border-radius: 18px; box-shadow: 0 3px 12px rgba(180,120,80,0.08); display: flex; flex-direction: column; gap: 1rem;">
    <input type="text" id="scribble-title" placeholder="give it a title... (optional)">
    <textarea id="scribble-input" placeholder="empty your mind"></textarea>
    <div style="display:flex; gap: 0.6rem; flex-wrap: wrap;">
    <button id="turn-into-task">turn into task</button>
    <button id="save-scribble">save</button>
    <button id="view-all-btn" onclick="location.href='scribble_view.html'">view past scribbles</button>
    </div>
    </section>

    <aside id="scribble-list" style="margin-top: 0.5rem;">
      <!-- scribble items will be added here -->
    </aside>
  </main>

  <footer style="margin-top:2rem;">
    <a href="index.html">← back</a>
  </footer>

  <script>
    // scribble log logic
    const input = document.getElementById('scribble-input');
    const titleInput = document.getElementById('scribble-title');
    const saveBtn = document.getElementById('save-scribble');
    const turnBtn = document.getElementById('turn-into-task');
    const listElem = document.getElementById('scribble-list');

    let scribbles = [];

    function loadScribbles() {
      const stored = localStorage.getItem('scribbles');
      scribbles = stored ? JSON.parse(stored) : [];
    }

    function saveScribbles() {
      localStorage.setItem('scribbles', JSON.stringify(scribbles));
    }

    function renderScribbles() {
      listElem.innerHTML = '';
      scribbles.forEach((entry) => {
        const btn = document.createElement('button');
        btn.className = 'scribble-item';
        const label = entry.title || (entry.text.length > 24 ? entry.text.slice(0,24)+'...' : entry.text);
        btn.textContent = label;
        btn.addEventListener('click', () => {
          location.href = `scribble_view.html`;
        });
        listElem.appendChild(btn);
      });
    }

    function addScribble(text) {
      if (!text) return;
      const id = Date.now().toString();
      const title = titleInput.value.trim();
      scribbles.push({ id, text, title: title || '', date: new Date().toISOString() });
      saveScribbles();
      renderScribbles();
    }

    function addTaskFromText(text) {
      if (!text) return;
      const tasksStored = localStorage.getItem('tasks');
      const tasksArray = tasksStored ? JSON.parse(tasksStored) : [];
      tasksArray.push({ text, completed: false, date: new Date().toISOString() });
      localStorage.setItem('tasks', JSON.stringify(tasksArray));
    }

    saveBtn.addEventListener('click', () => {
      addScribble(input.value.trim());
      input.value = '';
      titleInput.value = '';
    });

    turnBtn.addEventListener('click', () => {
      const txt = input.value.trim();
      if (txt) {
        addTaskFromText(txt);
        input.value = '';
      }
    });

    // initialise
    loadScribbles();
    renderScribbles();
  </script>
  <script src="pet-widget.js"></script>
  <script>
    (function() {
      var saved = localStorage.getItem('boji-theme');
      if (saved) document.body.classList.add('theme-' + saved);
    })();
  </script>
</body>
</html>
