<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - Settings</title>
</head>

<body>

  <header>
    <h1>boji</h1>
    <h2>settings</h2>
  </header>

  <main>

    <!-- Main Settings Buttons -->
    <section id="settingsMenu">
      <button type="button" onclick="showThemes()">themes</button>
      <br><br>
      <button type="button" onclick="location.href='music.html'">music</button>
    </section>

    <!-- Themes Section (Hidden Initially) -->
    <section id="themesSection" style="display:none;">
      <h3>themes</h3>

      <button type="button" onclick="applyTheme('dreamscape')">dreamscape 🌸</button>
      <br><br>

      <button type="button" onclick="applyTheme('comfort')">comfort 💙</button>
      <br><br>

      <button type="button" onclick="applyTheme('original')">original</button>
      <br><br>

      <button type="button" onclick="goBack()">⬅ back</button>
    </section>

  </main>

  <footer>
    <a href="index.html"> Home</a>
  </footer>

  <script>
    var themes = {
      dreamscape: '#fadadd',
      comfort:    '#cce5ff',
      original:   '#ffffff'
    };

    function applyTheme(name) {
      localStorage.setItem('boji-theme', name);
      document.body.style.backgroundColor = themes[name] || '';
    }

    function showThemes() {
      document.getElementById("settingsMenu").style.display = "none";
      document.getElementById("themesSection").style.display = "block";
    }

    function goBack() {
      document.getElementById("themesSection").style.display = "none";
      document.getElementById("settingsMenu").style.display = "block";
    }

    // apply saved theme on load
    (function() {
      var saved = localStorage.getItem('boji-theme');
      if (saved && themes[saved]) document.body.style.backgroundColor = themes[saved];
    })();
  </script>

</body>
</html>
