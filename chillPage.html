<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boji - pomodoro timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── page layout ── */
    #chill-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem 1rem 6rem;
    }

    /* ── preset chips ── */
    #preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      max-width: 480px;
    }
    .preset-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.88rem;
      background: #f5e6ce;
      color: #7a4a3a;
      border: 2px solid #edd9bb;
      box-shadow: none;
      animation: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .preset-btn:hover { background: #fde8d8; border-color: #e8848a; transform: translateY(-2px); }
    .preset-btn.active {
      background: linear-gradient(135deg, #f2b8b8, #d4a96a);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 3px 10px rgba(180,100,80,0.22);
    }

    /* ── custom input ── */
    #custom-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: #9a8070;
    }
    #custom-min {
      width: 60px;
      text-align: center;
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      font-size: 0.95rem;
    }

    /* ── ring timer ── */
    #timer-ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }
    #timer-svg {
      transform: rotate(-90deg);
      width: 220px;
      height: 220px;
    }
    #ring-bg {
      fill: none;
      stroke: #edd9bb;
      stroke-width: 14;
    }
    #ring-fill {
      fill: none;
      stroke: url(#ring-gradient);
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    #timer-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
    }
    #timer-time {
      font-size: 2.8rem;
      font-weight: bold;
      color: #b05a5a;
      letter-spacing: 0.04em;
      font-family: 'Pixelify Sans', sans-serif;
    }
    #timer-phase {
      font-size: 0.8rem;
      color: #9a8070;
      font-style: italic;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    /* ── controls ── */
    #timer-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    #btn-start {
      padding: 0.7rem 2.2rem;
      font-size: 1.05rem;
      border-radius: 24px;
      background: linear-gradient(135deg, #f2b8b8, #d4a96a);
      color: #fff;
    }
    #btn-reset {
      padding: 0.5rem 1.2rem;
      font-size: 0.88rem;
      border-radius: 18px;
      background: #f0e8e0;
      color: #9a8070;
      box-shadow: none;
      animation: none;
    }
    #btn-reset:hover { background: #e8d8cc; color: #5c4a3a; transform: none; }

    /* ── session log ── */
    #session-log {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #session-log h3 {
      font-size: 0.85rem;
      color: #9a8070;
      font-weight: normal;
      font-style: italic;
      margin: 0 0 0.2rem;
      text-align: center;
    }
    .session-entry {
      background: #fffaf4;
      border: 1.5px solid #edd9bb;
      border-radius: 12px;
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      color: #7a5a48;
      display: flex;
      justify-content: space-between;
      animation: fadeIn 0.3s ease both;
    }

    /* ── done message ── */
    #done-msg {
      font-size: 1rem;
      color: #b05a5a;
      font-style: italic;
      text-align: center;
      min-height: 1.4rem;
      animation: fadeIn 0.4s ease both;
    }
  </style>
</head>
<body>
  <header>
    <h1>boji</h1>
    <h2>pomodoro timer</h2>
  </header>

  <main id="chill-main">

    <!-- presets -->
    <div id="preset-row">
      <button class="preset-btn" data-mins="2">2 min</button>
      <button class="preset-btn" data-mins="5">5 min</button>
      <button class="preset-btn" data-mins="10">10 min</button>
      <button class="preset-btn" data-mins="15">15 min</button>
      <button class="preset-btn active" data-mins="25">25 min — classic</button>
      <button class="preset-btn" data-mins="30">30 min</button>
      <button class="preset-btn" data-mins="45">45 min</button>
      <button class="preset-btn" data-mins="60">1 hr</button>
    </div>

    <!-- custom -->
    <div id="custom-row">
      <span>or enter custom:</span>
      <input type="number" id="custom-min" min="1" max="120" placeholder="min">
      <button id="btn-custom" class="preset-btn">set</button>
    </div>

    <!-- ring -->
    <div id="timer-ring-wrap">
      <svg id="timer-svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#f2b8b8"/>
            <stop offset="100%" stop-color="#d4a96a"/>
          </linearGradient>
        </defs>
        <circle id="ring-bg"   cx="110" cy="110" r="96"/>
        <circle id="ring-fill" cx="110" cy="110" r="96"/>
      </svg>
      <div id="timer-display">
        <span id="timer-time">25:00</span>
        <span id="timer-phase">focus</span>
      </div>
    </div>

    <!-- controls -->
    <div id="timer-controls">
      <button id="btn-start">▶ start</button>
      <button id="btn-reset">↺ reset</button>
    </div>

    <div id="done-msg"></div>

    <!-- session log -->
    <div id="session-log">
      <h3>completed sessions</h3>
    </div>

  </main>

  <footer>
    <a href="index.html">← back</a>
  </footer>

  <script src="pet-widget.js"></script>
  <script>
    // ── ring setup ──────────────────────────────────────────
    const RADIUS   = 96;
    const CIRCUM   = 2 * Math.PI * RADIUS;
    const ringFill = document.getElementById('ring-fill');
    ringFill.style.strokeDasharray  = CIRCUM;
    ringFill.style.strokeDashoffset = 0;

    function setRing(fraction) {
      ringFill.style.strokeDashoffset = CIRCUM * (1 - fraction);
    }

    // ── localStorage keys ───────────────────────────────────
    const K_END   = 'boji-timer-end';       // ms UTC timestamp when timer expires
    const K_PAU   = 'boji-timer-paused';    // remaining seconds while paused
    const K_TOT   = 'boji-timer-total';     // total session seconds

    function storeSave() {
      // called on start/resume — store expected end wall-clock time
      localStorage.setItem(K_END, Date.now() + remaining * 1000);
      localStorage.setItem(K_TOT, totalSeconds);
      localStorage.removeItem(K_PAU);
    }
    function storePause() {
      localStorage.setItem(K_PAU, remaining);
      localStorage.setItem(K_TOT, totalSeconds);
      localStorage.removeItem(K_END);
    }
    function storeClear() {
      localStorage.removeItem(K_END);
      localStorage.removeItem(K_PAU);
      localStorage.removeItem(K_TOT);
    }

    // ── state ───────────────────────────────────────────────
    let totalSeconds  = 25 * 60;
    let remaining     = totalSeconds;
    let running       = false;
    let intervalId    = null;
    let sessionCount  = 0;

    // ── elements ────────────────────────────────────────────
    const timeDisplay = document.getElementById('timer-time');
    const phaseLabel  = document.getElementById('timer-phase');
    const btnStart    = document.getElementById('btn-start');
    const btnReset    = document.getElementById('btn-reset');
    const doneMsg     = document.getElementById('done-msg');
    const sessionLog  = document.getElementById('session-log');
    const customInput = document.getElementById('custom-min');

    // ── format ──────────────────────────────────────────────
    function fmt(secs) {
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function refreshDisplay() {
      timeDisplay.textContent = fmt(remaining);
      setRing(remaining / totalSeconds);
    }

    // ── preset selection ────────────────────────────────────
    function selectPreset(mins, sourceBtn) {
      if (running) return;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (sourceBtn) sourceBtn.classList.add('active');
      totalSeconds = mins * 60;
      remaining    = totalSeconds;
      doneMsg.textContent = '';
      storeClear();
      refreshDisplay();
    }

    document.querySelectorAll('.preset-btn[data-mins]').forEach(btn => {
      btn.addEventListener('click', () => selectPreset(parseInt(btn.dataset.mins), btn));
    });

    document.getElementById('btn-custom').addEventListener('click', () => {
      const val = parseInt(customInput.value);
      if (!val || val < 1 || val > 120) return;
      selectPreset(val, null);
      customInput.value = '';
    });

    // ── chime (Web Audio) ───────────────────────────────────
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [[523.25, 0], [659.25, 0.25], [783.99, 0.5], [1046.5, 0.85]].forEach(([freq, when]) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.18, ctx.currentTime + when);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + 0.9);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime + when);
          o.stop(ctx.currentTime + when + 1);
        });
      } catch(e) {}
    }

    // ── tick ────────────────────────────────────────────────
    function tick() {
      // re-sync remaining from wall clock for accuracy
      const end = parseInt(localStorage.getItem(K_END));
      if (end) remaining = Math.max(0, Math.round((end - Date.now()) / 1000));

      if (remaining <= 0) {
        clearInterval(intervalId);
        running = false;
        btnStart.textContent = '▶ start';
        phaseLabel.textContent = 'done!';
        doneMsg.textContent = 'well done — take a breath and rest a moment.';
        setRing(0);
        playChime();
        logSession();
        storeClear();
        return;
      }
      refreshDisplay();
    }

    // ── start / pause ───────────────────────────────────────
    btnStart.addEventListener('click', () => {
      if (remaining <= 0) return;
      if (running) {
        clearInterval(intervalId);
        running = false;
        btnStart.textContent = '▶ resume';
        phaseLabel.textContent = 'paused';
        storePause();
      } else {
        running = true;
        btnStart.textContent = '⏸ pause';
        phaseLabel.textContent = 'focus';
        doneMsg.textContent = '';
        storeSave();
        intervalId = setInterval(tick, 1000);
      }
    });

    // ── reset ───────────────────────────────────────────────
    btnReset.addEventListener('click', () => {
      clearInterval(intervalId);
      running   = false;
      remaining = totalSeconds;
      btnStart.textContent  = '▶ start';
      phaseLabel.textContent = 'focus';
      doneMsg.textContent   = '';
      storeClear();
      refreshDisplay();
    });

    // ── session log ─────────────────────────────────────────
    function logSession() {
      sessionCount++;
      const now   = new Date();
      const label = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const mins  = Math.round(totalSeconds / 60);
      const entry = document.createElement('div');
      entry.className = 'session-entry';
      entry.innerHTML = `<span>session ${sessionCount} &mdash; ${mins} min</span><span>${label}</span>`;
      sessionLog.appendChild(entry);
    }

    // ── init: restore persisted timer state ─────────────────
    (function restoreTimer() {
      const savedEnd    = localStorage.getItem(K_END);
      const savedPaused = localStorage.getItem(K_PAU);
      const savedTotal  = localStorage.getItem(K_TOT);

      // check for URL param first (chat-driven navigation)
      const urlMins = parseInt(new URLSearchParams(window.location.search).get('mins'));

      if (savedTotal && !urlMins) {
        // restore previous session
        totalSeconds = parseInt(savedTotal);
        if (savedEnd) {
          // was running — compute exact remaining from wall clock
          const rem = Math.round((parseInt(savedEnd) - Date.now()) / 1000);
          if (rem <= 0) {
            // timer elapsed while away
            remaining = 0;
            refreshDisplay();
            phaseLabel.textContent = 'done!';
            doneMsg.textContent = 'well done — take a breath and rest a moment.';
            setRing(0);
            storeClear();
          } else {
            remaining = rem;
            refreshDisplay();
            // highlight the matching preset button if any
            const matchBtn = document.querySelector('.preset-btn[data-mins="' + Math.round(totalSeconds/60) + '"]');
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (matchBtn) matchBtn.classList.add('active');
            // auto-resume
            running = true;
            btnStart.textContent = '⏸ pause';
            phaseLabel.textContent = 'focus';
            intervalId = setInterval(tick, 1000);
          }
        } else if (savedPaused) {
          // was paused
          remaining = parseInt(savedPaused);
          refreshDisplay();
          const matchBtn = document.querySelector('.preset-btn[data-mins="' + Math.round(totalSeconds/60) + '"]');
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          if (matchBtn) matchBtn.classList.add('active');
          btnStart.textContent = '▶ resume';
          phaseLabel.textContent = 'paused';
        }
        return; // done — don't apply URL param logic
      }

      // fresh open with optional URL param
      refreshDisplay();
      if (urlMins && urlMins >= 1) {
        const matching = document.querySelector('.preset-btn[data-mins="' + urlMins + '"]');
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        if (matching) matching.classList.add('active');
        totalSeconds = urlMins * 60;
        remaining    = totalSeconds;
        refreshDisplay();
        const energy = localStorage.getItem('boji-energy-' + new Date().toDateString());
        if (energy) {
          const hints = { high: 'high energy mode — 45 min deep focus', medium: 'steady pace — 25 min pomodoro', low: 'gentle session — 10 min focus' };
          if (hints[energy]) phaseLabel.textContent = hints[energy].split('—')[1].trim();
        }
      }
    })();
  </script>
  <script>
    (function() {
      var saved = localStorage.getItem('boji-theme');
      if (saved) document.body.classList.add('theme-' + saved);
    })();
  </script>
</body>
</html>
